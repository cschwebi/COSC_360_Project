<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - CC Blogs</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/createPost.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="header"></div>

    <nav class="breadcrumb">
        <a href="index.php">Home</a> &gt; 
        <a href="profile.html">Profile</a> &gt; 
        <span>Create Post</span>
    </nav>
    
    <div class="form-container">
        <h2>Create Post</h2>
        <form id="createPostForm" action="php_func/createPost.php" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="body">Body</label>
                <textarea id="body" name="body" rows="10" required></textarea>
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="topic">Topic</label>
                <select id="topic" name="topic" required>
                    <option value="">Select a topic</option>
                    <optgroup label="Topics">
                        <option value="Finance">Finance</option>
                        <option value="Health">Health</option>
                        <option value="Technology">Technology</option>
                        <option value="Travel">Travel</option>
                        <option value="Productivity">Productivity</option>
                        <option value="Food">Food</option>
                        <option value="Business">Business</option>
                        <option value="Parenting">Parenting</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </optgroup>
                </select>
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="headerImage">Header Image (Optional)</label>
                <input type="file" id="headerImage" name="headerImage" accept="image/*">
                <small>Supported formats: JPG, JPEG, PNG, GIF</small>
            </div>
            <div class="form-buttons">
                <button type="submit">Create Post</button>
                <button type="button" onclick="window.location.href='profile.php'">Cancel</button>
            </div>
        </form>
    </div>

    <script>
    $(document).ready(function() {
        $("#header").load("header.php");

        $("#createPostForm").submit(function(event) {
            event.preventDefault();
            
            var formData = new FormData(this);
            
            $.ajax({
                url: $(this).attr('action'),
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    try {
                        var result = JSON.parse(response);
                        if (result.success) {
                            alert(result.message);
                            window.location.href = 'profile.php';
                        } else {
                            alert('Error: ' + result.error);
                        }
                    } catch (e) {
                        alert('Error processing response from server');
                    }
                },
                error: function() {
                    alert('Error submitting form');
                }
            });
        });

        // Hide error message on input
        $("#title, #body, #topic").on("input", function() {
            $(this).removeClass("error");
            $(this).next(".error-message").hide();
        });

        // File type validation
        $("#headerImage").change(function() {
            var file = this.files[0];
            if (file) {
                var fileType = file.type;
                var validImageTypes = ['image/jpeg', 'image/png', 'image/gif'];
                if (!validImageTypes.includes(fileType)) {
                    alert('Please select a valid image file (JPG, JPEG, PNG, or GIF)');
                    this.value = '';
                }
            }
        });
    });
    </script>
</body>
</html>
