<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - CC Blogs</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/createPost.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="header"></div>

    <nav class="breadcrumb">
        <a href="index.html">Home</a> &gt; 
        <a href="profile.html">Profile</a> &gt; 
        <span>Create Post</span>
    </nav>
    
    <div class="form-container">
        <h2>Create Post</h2>
        <form id="createPostForm">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title">
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="body">Body</label>
                <textarea id="body" name="body" rows="10"></textarea>
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="topic">Topic</label>
                <select id="topic" name="topic">
                    <option value="">Select a topic</option>
                    <optgroup label="Topics">
                        <option value="Finance">Finance</option>
                        <option value="Health">Health</option>
                        <option value="Technology">Technology</option>
                        <option value="Travel">Travel</option>
                        <option value="Productivity">Productivity</option>
                        <option value="Food">Food</option>
                        <option value="Business">Business</option>
                        <option value="Parenting">Parenting</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </optgroup>
                </select>
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="headerImage">Header Image</label>
                <input type="file" id="headerImage" name="headerImage">
                <input type="hidden" id="defaultHeaderImage" name="defaultHeaderImage" value="path/to/default/image.jpg">
            </div>
            <div class="form-buttons">
                <button type="submit">Create Post</button>
                <button type="button" onclick="window.location.href='profile.html'">Cancel</button>
            </div>
        </form>
    </div>

    <script>
 $(document).ready(function() {
    $("#header").load("header.html");

    $("#createPostForm").submit(function(event) {
        var isValid = true;

        // Validate Title
        if ($("#title").val().trim() === "") {
            isValid = false;
            $("#title").addClass("error");
            $("#title").next(".error-message").show();
            event.preventDefault();
        } else {
            $("#title").removeClass("error");
            $("#title").next(".error-message").hide();
        }

        // Validate Body
        if ($("#body").val().trim() === "") {
            isValid = false;
            $("#body").addClass("error");
            $("#body").next(".error-message").show();
            event.preventDefault();
        } else {
            $("#body").removeClass("error");
            $("#body").next(".error-message").hide();
        }

        // Validate Topic
        if ($("#topic").val().trim() === "") {
            isValid = false;
            $("#topic").addClass("error");
            $("#topic").next(".error-message").show();
            event.preventDefault();
        } else {
            $("#topic").removeClass("error");
            $("#topic").next(".error-message").hide();
        }

        // Set default header image if none is provided
        if ($("#headerImage").val().trim() === "") {
            $("#headerImage").val($("#defaultHeaderImage").val());
        }

        // Prevent form submission if any field is invalid
        if (!isValid) {
            event.preventDefault();
        } else {
            alert("Post created successfully!");
        }
    });

    // Remove error class and hide error message on focus
    $("#title, #body, #topic").on("input", function() {
        $(this).removeClass("error");
        $(this).next(".error-message").hide();
    });
});

    </script>
</body>
</html>
