<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - CC Blogs</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/profile.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-group input.error,
        .form-group textarea.error {
            border-color: red;
        }
        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        .form-buttons {
            text-align: center;
        }
        .form-buttons button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="header"></div>
    
    <div class="form-container">
        <h2>Create Post</h2>
        <form id="createPostForm" method ="post" action="http://www.randyconnolly.com/tests/process.php"> 
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title">
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="body">Body</label>
                <textarea id="body" name="body" rows="10"></textarea>
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="headerImage">Header Image</label>
                <input type="file" id="headerImage" name="headerImage">
                <input type="hidden" id="defaultHeaderImage" name="defaultHeaderImage" value="path/to/default/image.jpg">
            </div>
            <div class="form-buttons">
                <button type="submit">Create Post</button>
                <button type="button" onclick="window.location.href='profile.html'">Cancel</button>
            </div>
        </form>
    </div>

    <script>
$(document).ready(function() {
    $("#header").load("header.html");
    
    $("#createPostForm").submit(function(event) {
        var isValid = true;

        // Check if title and body fields are filled
        if ($("#title").val().trim() === "") {
            isValid = false;
            $("#title").addClass("error");
            $("#title").next(".error-message").show();
        } else {
            $("#title").removeClass("error");
            $("#title").next(".error-message").hide();
        }

        if ($("#body").val().trim() === "") {
            isValid = false;
            $("#body").addClass("error");
            $("#body").next(".error-message").show();
        } else {
            $("#body").removeClass("error");
            $("#body").next(".error-message").hide();
        }

        // Set default header image if none is provided
        if ($("#headerImage").val() === "") {
            $("#headerImage").val($("#defaultHeaderImage").val());
        }

        if (!isValid) {
            event.preventDefault(); // Prevent form submission if validation fails
        } else {
            alert("Post created successfully!");
            // No need for `this.submit();` - the form will submit naturally
        }
    });

    // Remove error class and hide error message on focus
    $("#title, #body").focus(function() {
        $(this).removeClass("error");
        $(this).next(".error-message").hide();
    });
});

    </script>
</body>
</html>
