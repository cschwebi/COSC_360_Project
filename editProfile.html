<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CC Blogs</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editProfile.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="header"></div>

    <nav class="breadcrumb">
        <a href="index.html">Home</a> &gt; 
        <a href="profile.html">Profile</a> &gt; 
        <span>Edit Profile</span>
    </nav>
    
    <div class="form-container">
        <h2>Edit Profile</h2>
        <form id="editProfileForm" method="post" action="http://www.randyconnolly.com/tests/process.php">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" value="Name">
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="displayName">Display Name</label>
                <input type="text" id="displayName" name="displayName" value="Display name">
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="email@example.com">
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" rows="4">Lorem ipsum dolor sit amet, consectetur adipiscing elit...</textarea>
            </div>
            <div class="form-group">
                <label for="profilePicture">Profile Picture</label>
                <input type="file" id="profilePicture" name="profilePicture">
                <div class="error-message">Please upload a valid image file (jpg, jpeg, png)</div>
            </div>
            <div class="form-buttons">
                <button type="submit">Save Changes</button>
                <button type="button" onclick="window.location.href='profile.html'">Cancel</button>
            </div>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            $("#header").load("header.php");

            $("#editProfileForm").submit(function(event) {
                var isValid = true;

                $("#name, #displayName, #email").each(function() {
                    if ($(this).val().trim() === "") {
                        isValid = false;
                        $(this).addClass("error");
                        $(this).next(".error-message").show();
                    } else {
                        $(this).removeClass("error");
                        $(this).next(".error-message").hide();
                    }
                });

                // Validate Profile Picture
                var profilePicture = $("#profilePicture")[0].files[0];
                if (profilePicture && !profilePicture.type.match('image.*')) {
                    isValid = false;
                    $("#profilePicture").addClass("error");
                    $("#profilePicture").next(".error-message").show();
                } else {
                    $("#profilePicture").removeClass("error");
                    $("#profilePicture").next(".error-message").hide();
                }

                if (!isValid) {
                    event.preventDefault();
                } else {
                    alert("Profile updated successfully!");
                }
            });

            $("#name, #displayName, #email").on("input", function() {
                $(this).removeClass("error");
                $(this).next(".error-message").hide();
            });

            $("#profilePicture").on("change", function() {
                var profilePicture = $(this)[0].files[0];
                if (profilePicture && !profilePicture.type.match('image.*')) {
                    $(this).addClass("error");
                    $(this).next(".error-message").show();
                } else {
                    $(this).removeClass("error");
                    $(this).next(".error-message").hide();
                }
            });
        });
    </script>
</body>
</html>
