<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CC Blogs</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/register.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="header"></div>
    
    <nav class="breadcrumb">
        <a href="index.php">Home</a> &gt; 
        <span>Login</span>
    </nav>
    
    <div class="form-container">
        <h2>Login</h2>
        <form id="loginForm" action="php_func/login.php" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
                <div class="error-message">Please enter a valid email</div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
                <div class="error-message">This section is required</div>
            </div>
            <div class="form-buttons">
                <button type="submit">Login</button>
            </div>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            $("#header").load("header.php");

            $("#loginForm").submit(function(event) {
                event.preventDefault(); //prevent default form submission

                var isValid = true;

                //validate Email
                var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test($("#email").val().trim())) {
                    isValid = false;
                    $("#email").addClass("error");
                    $("#email").next(".error-message").show();
                } else {
                    $("#email").removeClass("error");
                    $("#email").next(".error-message").hide();
                }

                // Validate Password
                if ($("#password").val().trim() === "") {
                    isValid = false;
                    $("#password").addClass("error");
                    $("#password").next(".error-message").show();
                } else {
                    $("#password").removeClass("error");
                    $("#password").next(".error-message").hide();
                }

                if (isValid) {
                    // Simulate a successful login
                    // setTimeout(function() {
                    //    // window.location.href = "profile.html";
                    //    event.preventDefault();
                    // }, 1000);
                    event.target.submit();
                }
            });

            // Remove error class and hide error message on input
            $("#email, #password").on("input", function() {
                $(this).removeClass("error");
                $(this).next(".error-message").hide();
            });
        });
    </script>
</body>
</html>
