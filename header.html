<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CC Blogs Header</title>
  <link rel="stylesheet" href="css/header.css">
  <script src="https://kit.fontawesome.com/1df3bfa6c9.js" crossorigin="anonymous"></script>
  <script>
    (function(){
      if (localStorage.getItem('theme') === 'dark') {
        var darkModeLink = document.createElement('link');
        darkModeLink.rel = 'stylesheet';
        darkModeLink.href = 'css/darkmode.css';
        darkModeLink.id = 'dark-mode-css'; //still a WIP but is extra
        document.head.appendChild(darkModeLink);
      }
    })();
  </script>
</head>
<body>
<header>
  <div class="top-header">
    <h1><a href="index.html">CC Blogs</a></h1>
    <div class="search-bar">
      <form id="searchForm" method="get" action="http://www.randyconnolly.com/tests/process.php">
        <input type="text" name="search" placeholder="Search blogs">
        <button type="submit">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
    </div>
  </div>
  <nav>
    <ul>
      <li><a href="settings.html">Settings</a></li>
      <li><a href="authors.html">Authors</a></li>
      <li><a href="favourites.html">Favourites</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
  </nav>
</header>
</body>
</html>
